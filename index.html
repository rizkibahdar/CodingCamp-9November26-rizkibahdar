<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <p>Track your daily expenses and visualize your spending.</p>
    </header>

    <main>
      <section id="total-spending">
        <p>Total Spending</p>
        <p id="total-amount">Rp 0</p>
      </section>

      <section id="expense-form">
        <h2>Add Expense</h2>
        <form id="form">
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" placeholder="e.g. Lunch" />
            <span class="error" id="error-name"></span>
          </div>
          <div class="form-group">
            <label for="amount">Amount (IDR)</label>
            <input type="number" id="amount" placeholder="e.g. 25000" min="1" />
            <span class="error" id="error-amount"></span>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">-- Select Category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error" id="error-category"></span>
          </div>
          <button type="submit">Add Expense</button>
        </form>
      </section>

      <section id="chart-section">
        <h2>Spending Distribution</h2>
        <canvas id="spending-chart"></canvas>
        <p id="chart-empty-state">No data to display yet.</p>
      </section>

      <section id="transaction-list">
        <h2>Transaction History</h2>
        <ul id="list"></ul>
        <p id="list-empty-state">No transactions yet. Add your first expense above.</p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
